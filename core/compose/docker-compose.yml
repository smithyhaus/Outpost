name: infra

# =============================================================================
# Layer 1: stateful data services (local mode) + public ingress (full mode)
# -----------------------------------------------------------------------------
# Two mutually-exclusive profiles, selected by bootstrap.d/04-compose.sh from
# OUTPOST_MODE (see that file for the exact selection logic):
#
#   local-data : postgres / redis / rabbitmq / manticore. Used ONLY in
#                `local` mode, where these ARE the data layer (no k3s at
#                all). Apps reach them directly on localhost.
#
#   edge       : cloudflared + caddy. Used ONLY in `full` mode, where the
#                data layer instead runs in-cluster (core/k8s/06-bridges/) —
#                Compose's only job is the public ingress path. `edge` is
#                the renamed/extended `tunnel` profile from earlier releases;
#                keep the two profiles additive, not layered — a service
#                should never need both.
#
# Port exposure policy (local-data services only):
#   * Data services bind 0.0.0.0:<port> so host processes / apps outside
#     Docker can reach them directly. Not used in full mode — the in-cluster
#     bridges (core/k8s/06-bridges/) are the full-mode data path.
# =============================================================================

networks:
  infra:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  manticore_data:
  caddy_data:
  caddy_config:

services:
  # =========================================================================
  # Cloudflare Tunnel
  # Public Hostname routing is configured via the Cloudflare Dashboard.
  # See i18n/en/docs/01-cloudflare-setup.md for the full mapping.
  # =========================================================================
  cloudflared:
    # Profile-gated: only starts in `full` mode (when bootstrap passes
    # --profile edge). In `local` mode there's no public ingress at all —
    # apps reach the local-data services directly on localhost.
    profiles: ["edge"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # CF_TUNNEL_PROTOCOL: default `auto` (QUIC, http2 fallback). On restricted
    # networks that block QUIC's UDP/7844, set CF_TUNNEL_PROTOCOL=http2 in .env
    # so the connector registers over TCP. (Note: http2 cannot serve `cloudflared
    # access` TCP routes — expose TCP services via an HTTP reverse proxy instead.)
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run --protocol ${CF_TUNNEL_PROTOCOL:-auto} --token ${CF_TUNNEL_TOKEN}
    networks:
      - infra
    # cloudflared needs to reach host:30080 (k3s Traefik NodePort).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - caddy
    # The tunnel is the ONLY public path in. `restart: unless-stopped` only
    # fires on process crash — a silently-wedged connector (up but not
    # forwarding) previously had NO signal at all. `tunnel ready` queries the
    # metrics endpoint enabled above and exits non-zero until at least one
    # edge connection is up; verify.sh's compose section surfaces the status.
    # (Plain compose does not auto-restart on unhealthy — this is detection,
    # not self-heal.)
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 256m

  # =========================================================================
  # Caddy internal reverse proxy (HTTP only; TLS terminated at CF edge)
  # =========================================================================
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # Lets caddy reach host-bound services (e.g. the k3s API on :6443) for
    # reverse-proxy fragments in Caddyfile.d/. Mirrors cloudflared's mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ROOT_DOMAIN is required (host matchers depend on it). The built-in
      # data-service UI routes (search/mq) moved OFF Caddy and onto a
      # Traefik IngressRoute in-cluster — see
      # core/k8s/06-bridges/ingressroutes.template.yaml. Caddy now only
      # carries per-app onboarded fragments (Caddyfile.d/*.caddy) and the
      # opt-in k8s-api route.
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    networks:
      - infra
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.d:/etc/caddy/Caddyfile.d:ro
      - caddy_data:/data
      - caddy_config:/config
    # Second hop of the public path (cloudflared → caddy). Admin API on
    # localhost:2019 is on by default; busybox wget ships in caddy:2-alpine.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m

  # =========================================================================
  # PostgreSQL 16 + pgvector
  # `local-data` profile — `local` mode ONLY. In `full` mode Postgres runs
  # in-cluster instead (core/k8s/06-bridges/postgres.yaml); apps connect to
  # the SAME Service name (postgres.infra-bridges.svc.cluster.local:5432)
  # either way, so nothing in app config changes when switching modes.
  # Bound to 0.0.0.0:5432 so host processes can reach it directly.
  # =========================================================================
  postgres:
    profiles: ["local-data"]
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - infra
    ports:
      - "0.0.0.0:5432:5432"
    # Memory caps on all data services: they share ONE WSL2 VM memory pool
    # with the whole k3s cluster, but live outside kubectl's accounting —
    # unbounded, they can starve the pods (and vice versa) invisibly.
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis 7 (AOF + RDB persistence, password required)
  # `local-data` profile — see the postgres block above for the full
  # local/full mode split; full mode runs Redis in-cluster instead
  # (core/k8s/06-bridges/redis.yaml).
  # =========================================================================
  redis:
    profiles: ["local-data"]
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - infra
    ports:
      - "0.0.0.0:6379:6379"
    # maxmemory 4g (above) + AOF/fork overhead headroom.
    mem_limit: 5g
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # RabbitMQ 3.13 + management plugin
  # AMQP on 5672 / Management UI on 15672
  # `local-data` profile — see the postgres block above for the full
  # local/full mode split; full mode runs RabbitMQ in-cluster instead
  # (core/k8s/06-bridges/rabbitmq.yaml), UI reached via a Traefik
  # IngressRoute instead of Caddy.
  # =========================================================================
  rabbitmq:
    profiles: ["local-data"]
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - infra
    ports:
      - "0.0.0.0:5672:5672"
      - "0.0.0.0:15672:15672"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================================================
  # Manticore Search 7.4.6 — standalone mode (replication hook reserved)
  # - 9308 : HTTP / JSON API   (replaces Meilisearch's 7700)
  # - 9306 : MySQL wire protocol (for apps that prefer SQL)
  # - 9312 : binary protocol + reserved port for future replication
  # The conf.d mount is inert in standalone (default config does not
  # `include` it). To enable replication, see core/compose/manticore/README.md.
  # `local-data` profile — see the postgres block above for the full
  # local/full mode split; full mode runs Manticore in-cluster instead
  # (core/k8s/06-bridges/manticore.yaml), UI reached via a Traefik
  # IngressRoute instead of Caddy.
  # =========================================================================
  manticore:
    profiles: ["local-data"]
    image: manticoresearch/manticore:7.4.6
    container_name: manticore
    restart: unless-stopped
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - manticore_data:/var/lib/manticore
      # NOT :ro — the Manticore entrypoint chowns this dir at start; a
      # read-only bind mount makes chown fail and the container loops.
      - ./manticore/conf.d:/etc/manticoresearch/conf.d
    networks:
      - infra
    ports:
      - "0.0.0.0:9308:9308"
      - "0.0.0.0:9306:9306"
      - "0.0.0.0:9312:9312"
    mem_limit: 2g
    # Manticore image ships wget + mysql but NOT curl. 127.0.0.1 (not
    # localhost) for the same IPv6-first-resolution reason called out
    # in the old Meilisearch healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9308/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
