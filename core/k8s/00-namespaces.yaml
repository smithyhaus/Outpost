apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra-bridges
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
# Testkube — K8s-native test orchestrator (test-runner plugin).
# `baseline` PSA so TestWorkflow runner pods can mount workspaces.
apiVersion: v1
kind: Namespace
metadata:
  name: testkube
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
# Argo Rollouts — progressive delivery + auto-rollback (rollout plugin).
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
# buildkit — the persistent build daemon (core/k8s/08-buildkit). buildkitd runs
# `privileged: true` (mount/overlayfs/runc), which `baseline`/`restricted` PSA
# forbid; this namespace is the ONLY one labeled `enforce=privileged`. The
# buildctl CLIENT runs on the host (self-hosted GitHub Actions runner), talking
# to buildkitd through the buildkitd-nodeport Service (core/k8s/03-ci) — only
# the daemon needs the elevated level, and isolating it here keeps the blast
# radius to one ns.
apiVersion: v1
kind: Namespace
metadata:
  name: buildkit
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# outpost-ci — manifest-sync CronJob (CD) + supporting RBAC/PVC/ConfigMaps.
# Runs `kubectl apply -k` against apps-ns and writes its own heartbeat CM;
# default (restricted) PSA is sufficient — no privileged workloads here.
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-ci
