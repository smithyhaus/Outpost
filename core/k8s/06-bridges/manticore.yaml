# =============================================================================
# Manticore Search 7.4.6 — standalone mode (replication hook reserved).
# -----------------------------------------------------------------------------
# - 9308 : HTTP / JSON API
# - 9306 : MySQL wire protocol (for apps that prefer SQL)
# Same Service name/ports as the old ExternalName bridge
# (manticore.infra-bridges.svc.cluster.local) — 9312 (binary/replication) is
# reserved but was never part of the bridge Service, so it stays off here too.
#
# Carried over from core/compose/docker-compose.yml `manticore`: image pin,
# 2Gi memory cap, HTTP healthcheck, conf.d mount (replication hook, inert by
# default). NOT carried over: the `ulimits` (nproc/nofile) block — Kubernetes
# has no pod-spec equivalent to Compose's per-container ulimits; see
# followups.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manticore
  namespace: infra-bridges
  labels:
    app: manticore
spec:
  serviceName: manticore
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: manticore
  template:
    metadata:
      labels:
        app: manticore
    spec:
      # The Manticore entrypoint chowns /etc/manticoresearch/conf.d at start
      # (same reason Compose's mount is NOT :ro — see
      # core/compose/manticore/README.md "Why the mount is not :ro"). A
      # ConfigMap volume is always read-only in k8s, so this initContainer
      # copies the ConfigMap's content into a writable emptyDir that the
      # main container mounts instead.
      initContainers:
        - name: conf-init
          image: m.daocloud.io/docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - "cp -a /confd-src/. /confd-dest/"
          volumeMounts:
            - name: confd-src
              mountPath: /confd-src
              readOnly: true
            - name: confd-dest
              mountPath: /confd-dest
      containers:
        - name: manticore
          image: m.daocloud.io/docker.io/manticoresearch/manticore:7.4.6
          ports:
            - name: http
              containerPort: 9308
            - name: mysql
              containerPort: 9306
          volumeMounts:
            - name: data
              mountPath: /var/lib/manticore
            - name: confd-dest
              mountPath: /etc/manticoresearch/conf.d
          # Same cap as Compose's mem_limit: 2g.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          # Manticore image ships wget + mysql but NOT curl. httpGet is the
          # native k8s equivalent of Compose's `wget -qO- http://127.0.0.1:9308/`.
          readinessProbe:
            httpGet:
              path: /
              port: 9308
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 9308
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: manticore-data
        - name: confd-src
          configMap:
            name: manticore-confd
        - name: confd-dest
          emptyDir: {}
---
# local-path PVC. Same Retain-hardening note as postgres-data — see
# postgres.yaml and the followups list.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manticore-data
  namespace: infra-bridges
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: manticore
  namespace: infra-bridges
spec:
  selector:
    app: manticore
  ports:
    - name: http
      port: 9308
      targetPort: 9308
      protocol: TCP
    - name: mysql
      port: 9306
      targetPort: 9306
      protocol: TCP
