# =============================================================================
# infra-bridges public UIs — Traefik IngressRoute (replaces the Caddy
# @search / @mq proxy fragments that used to live in core/compose/Caddyfile).
# -----------------------------------------------------------------------------
# Data services now run in-cluster, so their HTTP UIs are reached the same
# way every other k3s-hosted route is: CF edge -> cloudflared ->
# host.docker.internal:30080 (Traefik NodePort) -> this IngressRoute, on the
# `web` entryPoint — same pattern as the registry route in
# plugins/registry/self-hosted/manifest.yaml.
#
# ${SEARCH_HOST} / ${MQ_HOST} default to "search" / "mq" — exported by
# bootstrap.d/04-compose.sh (NOT bootstrap.d/02-config.sh)
# specifically so render_template's unresolved-
# placeholder check has something to substitute here without requiring the
# operator to set them. Override in .env (documented in .env.example) to
# relocate the subdomain, same as before.
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq-mgmt
  namespace: infra-bridges
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${MQ_HOST}.${ROOT_DOMAIN}`)
      kind: Rule
      services:
        - name: rabbitmq
          port: 15672
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manticore-http
  namespace: infra-bridges
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${SEARCH_HOST}.${ROOT_DOMAIN}`)
      kind: Rule
      services:
        - name: manticore
          port: 9308
