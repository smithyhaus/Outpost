# =============================================================================
# manticore-confd — ConfigMap mirror of core/compose/manticore/conf.d/
# -----------------------------------------------------------------------------
# Same dormant replication hook as the Compose layer: shipped `.disabled` so
# it is never auto-loaded (the default Manticore config does not `include`
# conf.d/). See core/compose/manticore/README.md for the full activation
# steps — the mechanism (rename, then supply a manticore.conf that includes
# this dir) is identical here, just applied to the StatefulSet instead of
# the Compose service.
#
# Static content, no env substitution — plain `kubectl apply`, not rendered.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: manticore-confd
  namespace: infra-bridges
data:
  99-replication.conf.disabled: |
    # =========================================================================
    # Manticore Search — replication snippet (DISABLED by default)
    # -------------------------------------------------------------------------
    # Ships with the `.disabled` suffix so it is NEVER auto-loaded. This
    # StatefulSet runs Manticore standalone; this is the hook for the day you
    # decide to turn it into a replication node.
    #
    # See core/compose/manticore/README.md for the full step-by-step (rename,
    # supply a manticore.conf with `include = conf.d/*.conf`, publish the
    # replication port range, then CREATE CLUSTER).
    # =========================================================================
    searchd {
        # Node identity — must be unique across the cluster. In-cluster, use
        # the pod's stable DNS name instead of host.docker.internal.
        node_address = manticore-0.manticore.infra-bridges.svc.cluster.local

        # Reserve the binary protocol port for cluster traffic
        listen = 0.0.0.0:9312:replication

        # Where SST snapshots and Galera state live (mounted to manticore-data)
        data_dir = /var/lib/manticore

        # Bind ports for SST / IST. Make sure any published range matches the
        # manticore.yaml Service/StatefulSet port list.
        # listen_replication_range = 9315-9325
    }
