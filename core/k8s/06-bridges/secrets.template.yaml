# =============================================================================
# infra-bridges auth — mirrors how Compose feeds data-service passwords
# straight from .env (POSTGRES_PASSWORD / REDIS_PASSWORD / RABBITMQ_PASSWORD
# etc.). Same source of truth, same values — apps that already read these
# creds do not need to change anything.
#
# Rendered (envsubst via render_template) at bootstrap time, then kubectl
# applied. NOT a SealedSecret: this Secret is regenerated from .env on every
# bootstrap run (idempotent), unlike the Tekton git-credentials pattern which
# is provider-token material meant to be GitOps-synced.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: infra-bridges-auth
  namespace: infra-bridges
type: Opaque
stringData:
  postgres-user: ${POSTGRES_USER}
  postgres-password: ${POSTGRES_PASSWORD}
  postgres-db: ${POSTGRES_DB}
  redis-password: ${REDIS_PASSWORD}
  rabbitmq-user: ${RABBITMQ_USER}
  rabbitmq-password: ${RABBITMQ_PASSWORD}
