# =============================================================================
# postgres-init — ConfigMap mirror of core/compose/postgres-init/*.sql
# -----------------------------------------------------------------------------
# Mounted at /docker-entrypoint-initdb.d, same contract as the Compose bind
# mount: the official postgres image runs every *.sql/*.sh in that directory,
# in filename order, ONLY on a brand-new (empty) PGDATA volume. Read-only
# ConfigMap mount is fine here — postgres only reads this directory, unlike
# Manticore's conf.d (see manticore-confd-configmap.yaml for why that one
# needs a writable copy).
#
# Static content, no env substitution — plain `kubectl apply`, not rendered.
# Keep in sync with core/compose/postgres-init/01-pgvector.sql by hand; there
# is currently no single source shared between the two layers.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: infra-bridges
data:
  01-pgvector.sql: |
    -- Runs only on a fresh data volume (Postgres docker entrypoint contract).
    -- For an existing database, run these CREATE EXTENSION statements manually.
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
