# =============================================================================
# Plugin: test-runner / testkube
# -----------------------------------------------------------------------------
# Marker + post-install configuration. Only when TESTKUBE_MODE=oss is the
# Testkube agent itself installed by bootstrap.sh via `helm install` (helm
# is auto-downloaded if absent — matching the kubeseal pattern); the default
# TESTKUBE_MODE=skip installs no agent at all. This file:
#   - Records which test-runner is active (v0.3: read by
#     scripts/ci/run-tests.sh, invoked as a workflow step on the GitHub
#     Actions runner — replaces the retired Tekton run-tests Task).
#   - Sets a tight ResourceQuota on the testkube namespace so a runaway
#     TestWorkflow can't OOM the cluster.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: outpost-test-runner
  namespace: testkube
  labels:
    outpost.io/plugin-kind: test-runner
data:
  runner: "testkube"
  mode: "${TESTKUBE_MODE}"
  # scripts/ci/run-tests.sh reads `cli-image` to invoke `testkube run testworkflow`.
  cli-image: "kubeshop/testkube-cli:latest"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: testkube-quota
  namespace: testkube
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
