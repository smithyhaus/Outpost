# =============================================================================
# Plugin: notification / webhook-generic
# -----------------------------------------------------------------------------
# Sends the raw normalized Outpost payload (no vendor wrapper) to a configured
# HTTPS endpoint. Useful for testing, custom collectors, alertmanager bridges.
#
# v0.3: ArgoCD + Tekton are gone. Consumers now:
#   - manifest-sync CronJob (ns outpost-ci) — volume-mounts this Secret +
#     ConfigMap so scripts/notify-fanout.sh's existing /secrets/<p>/* and
#     /templates/<p>/body.tmpl file contract keeps working unchanged.
#   - GitHub Actions workflow step (build-failed) and the host verify.sh
#     systemd timer (verify-failed) invoke notify-fanout.sh with
#     `--env-file $OUTPOST_ROOT/.env` instead of a volume mount.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: generic-webhook
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: generic
type: Opaque
stringData:
  webhook-url: "${GENERIC_WEBHOOK_URL}"
  bearer: "${GENERIC_WEBHOOK_BEARER}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generic-template
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: generic
data:
  body.tmpl: |
    {
      "event": "${NOTIFY_EVENT}",
      "level": "${NOTIFY_LEVEL}",
      "app": "${NOTIFY_APP}",
      "env": "${NOTIFY_ENV}",
      "commit": "${NOTIFY_COMMIT}",
      "ref": "${NOTIFY_REF}",
      "url": "${NOTIFY_URL}",
      "text": "${NOTIFY_TEXT}",
      "pusher": "${NOTIFY_PUSHER}"
    }
