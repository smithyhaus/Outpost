kind: notification
name: webhook-generic
description: |
  Generic JSON webhook fallback — POSTs the unified Outpost payload to your
  own collector (e.g. an internal alertmanager, custom relay, or local script).
  No vendor template; just the raw normalized JSON.
required_env:
  - GENERIC_WEBHOOK_URL
optional_env:
  - GENERIC_WEBHOOK_BEARER
provides:
  - channel: generic
  - delivery: "HTTPS POST with Content-Type application/json"
  - body: the unified Outpost payload (event/level/app/env/commit/ref/url/text/pusher)
  - events: build-failed, deploy-succeeded, deploy-failed, verify-failed
  - integrates: manifest-sync CronJob (ns outpost-ci, volume-mounted) + host
      callers (GitHub Actions workflow, verify.sh systemd timer) via
      scripts/notify-fanout.sh --env-file
caveats:
  - "No retry on 4xx/5xx — your receiver should be idempotent and tolerate replays."
  - "If GENERIC_WEBHOOK_BEARER is set, sent as Authorization Bearer header."
