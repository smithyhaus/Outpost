# =============================================================================
# Plugin: notification / dingtalk
# -----------------------------------------------------------------------------
# v0.3: ArgoCD + Tekton are gone, so this no longer feeds an
# argocd-notifications-cm/secret merge or a Tekton Task mount. Consumers now:
#   - manifest-sync CronJob (ns outpost-ci) — volume-mounts this Secret +
#     ConfigMap so scripts/notify-fanout.sh's existing /secrets/<p>/* and
#     /templates/<p>/body.tmpl file contract keeps working unchanged.
#   - GitHub Actions workflow step (build-failed) and the host verify.sh
#     systemd timer (verify-failed) run OUTSIDE the cluster; they invoke
#     notify-fanout.sh with `--env-file $OUTPOST_ROOT/.env` instead of a
#     volume mount (see scripts/notify-fanout.sh header for the flag).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dingtalk-webhook
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: dingtalk
type: Opaque
stringData:
  webhook-url: "${DINGTALK_WEBHOOK_URL}"
  sign-secret: "${DINGTALK_SIGN_SECRET}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dingtalk-template
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: dingtalk
data:
  # notify-fanout.sh reads `body.tmpl` and pipes it through `envsubst` at run
  # time with NOTIFY_* env vars derived from the unified payload.
  body.tmpl: |
    {
      "msgtype": "markdown",
      "markdown": {
        "title": "[${NOTIFY_LEVEL}] ${NOTIFY_APP} ${NOTIFY_EVENT}",
        "text": "### ${NOTIFY_APP} \\u0060${NOTIFY_COMMIT}\\u0060 in \\u0060${NOTIFY_ENV}\\u0060\\n\\n- **event**: ${NOTIFY_EVENT}\\n- **ref**: ${NOTIFY_REF}\\n- **pusher**: ${NOTIFY_PUSHER}\\n- **detail**: [open](${NOTIFY_URL})\\n\\n${NOTIFY_TEXT}"
      }
    }
