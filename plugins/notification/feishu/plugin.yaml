kind: notification
name: feishu
description: |
  Feishu (Lark) custom-bot webhook notifications. Renders the unified Outpost
  notification payload into a Feishu interactive card. Optional signed webhook
  supported.
required_env:
  - FEISHU_WEBHOOK_URL
optional_env:
  - FEISHU_SIGN_SECRET
provides:
  - channel: feishu
  - delivery: HTTPS POST to open.feishu.cn
  - events: build-failed, deploy-succeeded, deploy-failed, verify-failed
  - integrates: manifest-sync CronJob (ns outpost-ci, volume-mounted) + host
      callers (GitHub Actions workflow, verify.sh systemd timer) via
      scripts/notify-fanout.sh --env-file
caveats:
  - Without sign secret, the bot accepts any traffic with the URL. Rotate if leaked.
  - Per-bot rate limit ≈ 100 msg/min (more generous than DingTalk).
