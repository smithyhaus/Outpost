# =============================================================================
# Plugin: notification / feishu
# -----------------------------------------------------------------------------
# v0.3: ArgoCD + Tekton are gone. Consumers now:
#   - manifest-sync CronJob (ns outpost-ci) — volume-mounts this Secret +
#     ConfigMap so scripts/notify-fanout.sh's existing /secrets/<p>/* and
#     /templates/<p>/body.tmpl file contract keeps working unchanged.
#   - GitHub Actions workflow step (build-failed) and the host verify.sh
#     systemd timer (verify-failed) run OUTSIDE the cluster; they invoke
#     notify-fanout.sh with `--env-file $OUTPOST_ROOT/.env` instead of a
#     volume mount.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: feishu-webhook
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: feishu
type: Opaque
stringData:
  webhook-url: "${FEISHU_WEBHOOK_URL}"
  sign-secret: "${FEISHU_SIGN_SECRET}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feishu-template
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: feishu
data:
  # Feishu interactive card — read at run time and envsubst-rendered with
  # NOTIFY_* env vars.
  body.tmpl: |
    {
      "msg_type": "interactive",
      "card": {
        "config": { "wide_screen_mode": true },
        "header": {
          "title": { "tag": "plain_text", "content": "[${NOTIFY_LEVEL}] ${NOTIFY_APP} ${NOTIFY_EVENT}" },
          "template": "red"
        },
        "elements": [
          {
            "tag": "div",
            "text": {
              "tag": "lark_md",
              "content": "**${NOTIFY_APP}** \\u0060${NOTIFY_COMMIT}\\u0060 in \\u0060${NOTIFY_ENV}\\u0060\\n\\n- event: ${NOTIFY_EVENT}\\n- ref: ${NOTIFY_REF}\\n- pusher: ${NOTIFY_PUSHER}\\n- ${NOTIFY_TEXT}"
            }
          },
          {
            "tag": "action",
            "actions": [
              { "tag": "button", "text": { "tag": "plain_text", "content": "Open" }, "type": "primary", "url": "${NOTIFY_URL}" }
            ]
          }
        ]
      }
    }
