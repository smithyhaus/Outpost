# =============================================================================
# Plugin: notification / wecom (企业微信群机器人)
# -----------------------------------------------------------------------------
# v0.3: ArgoCD + Tekton are gone. Consumers now:
#   - manifest-sync CronJob (ns outpost-ci) — volume-mounts this Secret +
#     ConfigMap so scripts/notify-fanout.sh's existing /secrets/<p>/* and
#     /templates/<p>/body.tmpl file contract keeps working unchanged.
#   - GitHub Actions workflow step (build-failed) and the host verify.sh
#     systemd timer (verify-failed) invoke notify-fanout.sh with
#     `--env-file $OUTPOST_ROOT/.env` instead of a volume mount.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: wecom-webhook
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: wecom
type: Opaque
stringData:
  webhook-url: "${WECOM_WEBHOOK_URL}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wecom-template
  namespace: outpost-ci
  labels:
    outpost.io/notification-provider: wecom
data:
  body.tmpl: |
    {
      "msgtype": "markdown",
      "markdown": {
        "content": "## <font color=\\"warning\\">[${NOTIFY_LEVEL}] ${NOTIFY_APP} ${NOTIFY_EVENT}</font>\\n>**ref**: \\u0060${NOTIFY_REF}\\u0060\\n>**commit**: \\u0060${NOTIFY_COMMIT}\\u0060\\n>**pusher**: ${NOTIFY_PUSHER}\\n>**env**: \\u0060${NOTIFY_ENV}\\u0060\\n>**detail**: [open](${NOTIFY_URL})\\n>${NOTIFY_TEXT}"
      }
    }
