# =============================================================================
# Plugin: rollout / argo-rollouts
# -----------------------------------------------------------------------------
# v0.3: controller-only. ROLLOUT_PLUGIN defaults to `none` — this plugin is
# opt-in. When enabled, bootstrap applies the vendored, version-pinned
# controller manifest (not curl'd from upstream's floating `latest` path):
#   core/k8s/vendor/argo-rollouts-install-v1.9.0.yaml
# See that vendor file's header for the upgrade process. The dashboard
# (argo-rollouts-dashboard-install) and its IngressRoute are RETIRED — there
# is no ArgoCD/Tekton dashboard tier left to share a BasicAuth middleware
# with, and the manifest-sync CronJob (not a UI) drives deploys. Operators
# who want the UI can `kubectl apply -f` the dashboard manifest by hand and
# port-forward it; it's no longer part of the default install surface.
#
# This ConfigMap is a marker + strategy record (consumed by verify.sh /
# doctor.sh to confirm the plugin was applied and to record the locked
# threshold defaults documented in analysistemplate-default.yaml). It lives
# in `argo-rollouts` — its own namespace — now that tekton-pipelines is gone.
#
# Apps that want canary + auto-rollback adopt the `Rollout` CRD instead of
# `Deployment` in their own manifests; the manifest-sync CronJob is
# Rollout-kind aware (waits on Rollout status the same way it waits on a
# plain Deployment rollout) — see README.md.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: outpost-rollout
  namespace: argo-rollouts
  labels:
    outpost.io/plugin-kind: rollout
data:
  strategy: "argo-rollouts"
  default-template: "outpost-default"
  smoke-template: "outpost-smoke"
  failure-limit: "2"
  consecutive-error-limit: "3"
