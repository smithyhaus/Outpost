# =============================================================================
# Plugin: registry / aliyun-acr
# -----------------------------------------------------------------------------
# External managed registry — Alibaba Cloud Container Registry (ACR).
# One Secret:
#   - aliyun-acr-pull (apps): imagePullSecret for application Pods.
# v0.3: the kaniko-era `registry-credentials` Secret (ns tekton-pipelines)
# retired with Tekton. PUSH auth now happens on the HOST: scripts/ci/
# build-image.sh sources .env (ALIYUN_ACR_USER/PASSWORD) and authenticates
# the buildctl push client-side — no in-cluster docker-config Secret needed.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: aliyun-acr-pull
  namespace: apps
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "${ALIYUN_ACR_REGISTRY}": {
          "username": "${ALIYUN_ACR_USER}",
          "password": "${ALIYUN_ACR_PASSWORD}",
          "auth": ""
        }
      }
    }
