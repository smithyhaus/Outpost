# =============================================================================
# Plugin: git-provider / gitee
# -----------------------------------------------------------------------------
# v0.3: no cluster objects. The inbound-webhook path (TriggerBinding/EventListener
# Trigger) retired with Tekton — CI is now triggered by GitHub Actions on a
# self-hosted runner (see templates/github/outpost-build.yml), and gitee's role
# narrows to: primary push target, MANIFEST_REPO_URL host, and the host
# preflight.sh / verify.sh match OUTPOST_REPOS entries against.
#
# This file is a plain data contract (no envsubst placeholders, nothing
# applied via kubectl) consumed by:
#   - preflight.sh — resolves credentials for OUTPOST_REPOS entries whose
#     host matches `host` below (GIT_USER/GIT_TOKEN when host == GIT_HOST,
#     else a GIT_CREDENTIALS_EXTRA `host|user|token` entry) and probes each
#     with an authenticated `git ls-remote`.
#   - verify.sh reconciliation — same host-matching convention, for the live
#     HEAD vs deployed-manifest-tag check.
# =============================================================================
host: gitee.com
role: primary
credential-template:
  # Primary host (GIT_HOST derived from MANIFEST_REPO_URL): GIT_USER/GIT_TOKEN.
  # Any OTHER OUTPOST_REPOS entry on gitee.com (rare — gitee is normally the
  # single primary) falls back to a GIT_CREDENTIALS_EXTRA `host|user|token`
  # entry, same as any other provider.
  primary-user-env: GIT_USER
  primary-token-env: GIT_TOKEN
  extra-env: GIT_CREDENTIALS_EXTRA
