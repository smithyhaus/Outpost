# =============================================================================
# Plugin: git-provider / gitlab
# -----------------------------------------------------------------------------
# v0.3: no cluster objects. The inbound-webhook path (TriggerBinding/
# EventListener Trigger, plain X-Gitlab-Token compare) retired with Tekton.
# GitLab (gitlab.com or self-hosted CE/EE) is now just a credential +
# host-matching contract, same shape as gitee/github.
#
# This file is a plain data contract (no envsubst placeholders, nothing
# applied via kubectl) consumed by:
#   - preflight.sh — resolves credentials for OUTPOST_REPOS entries whose
#     host matches the `host-pattern` heuristic below, probes each with an
#     authenticated `git ls-remote`.
#   - verify.sh reconciliation — same host-matching convention.
# =============================================================================
host: gitlab.com
host-pattern: "gitlab\\."   # also matches self-hosted, e.g. gitlab.corp.example
role: optional
credential-template:
  primary-user-env: GIT_USER
  primary-token-env: GIT_TOKEN
  extra-env: GIT_CREDENTIALS_EXTRA
